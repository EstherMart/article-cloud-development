<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440"><title>Consulta com cache e download do PDF</title><defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<text x="520" y="30.3" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222" font-family="DejaVu Sans, Arial, sans-serif">Consulta com cache e download do PDF</text>
<text x="20" y="64.5" text-anchor="start" font-size="13" font-weight="bold" fill="#222222" font-family="DejaVu Sans, Arial, sans-serif">Consulta (GET /articles/ ou /articles/{id}/)</text>
<rect x="20" y="85" width="150" height="56" rx="28.0" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.8"/>
<text x="95.0" y="108.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Arial, sans-serif">Usuário pede</text>
<text x="95.0" y="126.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#444444" font-family="DejaVu Sans, Arial, sans-serif">o artigo</text>
<path d="M 170,113 L 220,113" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ponta)"/>
<polygon points="310,68.0 400.0,113 310,158.0 220.0,113" fill="#ffffff" stroke="#444444" stroke-width="1.8"/>
<text x="310" y="109.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Arial, sans-serif">Está no</text>
<text x="310" y="125.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#444444" font-family="DejaVu Sans, Arial, sans-serif">Redis?</text>
<path d="M 400,113 L 470,113" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ponta)"/>
<text x="435.0" y="109.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222" font-family="DejaVu Sans, Arial, sans-serif">sim</text>
<rect x="470" y="85" width="170" height="56" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.8"/>
<text x="555.0" y="108.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Arial, sans-serif">Devolve o JSON</text>
<text x="555.0" y="126.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#444444" font-family="DejaVu Sans, Arial, sans-serif">do cache</text>
<path d="M 310,158 L 310,195" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ponta)"/>
<text x="292.0" y="180.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222" font-family="DejaVu Sans, Arial, sans-serif">não</text>
<rect x="220" y="195" width="180" height="56" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.8"/>
<text x="310.0" y="227.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Arial, sans-serif">Consulta o RDS</text>
<path d="M 400,223 L 440,223" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ponta)"/>
<rect x="440" y="195" width="200" height="56" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.8"/>
<text x="540.0" y="218.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Arial, sans-serif">Grava no Redis</text>
<text x="540.0" y="236.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#444444" font-family="DejaVu Sans, Arial, sans-serif">com TTL de 300 s</text>
<path d="M 640,223 L 700,223 L 700,141" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ponta)"/>
<path d="M 640,113 L 700,113" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ponta)"/>
<rect x="700" y="85" width="140" height="56" rx="28.0" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.8"/>
<text x="770.0" y="108.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Arial, sans-serif">Responde o</text>
<text x="770.0" y="126.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#444444" font-family="DejaVu Sans, Arial, sans-serif">JSON</text>
<text x="20" y="294.2" text-anchor="start" font-size="12" font-weight="normal" fill="#222222" font-family="DejaVu Sans, Arial, sans-serif">Escrita (POST, PUT, DELETE): apaga artigo:{id}, artigos:recentes e busca:*. O worker apaga artigo:{id} ao terminar a tradução.</text>
<text x="20" y="334.6" text-anchor="start" font-size="13" font-weight="bold" fill="#222222" font-family="DejaVu Sans, Arial, sans-serif">Download (GET /articles/{id}/download/)</text>
<rect x="20" y="350" width="150" height="56" rx="28.0" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.8"/>
<text x="95.0" y="373.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Arial, sans-serif">Usuário pede</text>
<text x="95.0" y="391.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#444444" font-family="DejaVu Sans, Arial, sans-serif">o PDF</text>
<path d="M 170,378 L 230,378" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ponta)"/>
<rect x="230" y="350" width="220" height="56" rx="8" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.8"/>
<text x="340.0" y="373.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Arial, sans-serif">API gera a URL</text>
<text x="340.0" y="391.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#444444" font-family="DejaVu Sans, Arial, sans-serif">pré-assinada (300 s)</text>
<path d="M 450,378 L 510,378" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ponta)"/>
<rect x="510" y="350" width="180" height="56" rx="28.0" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.8"/>
<text x="600.0" y="373.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Arial, sans-serif">Responde com</text>
<text x="600.0" y="391.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#444444" font-family="DejaVu Sans, Arial, sans-serif">download_url</text>
<path d="M 690,378 L 750,378" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ponta)"/>
<rect x="750" y="350" width="260" height="56" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.8"/>
<text x="880.0" y="373.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Arial, sans-serif">Navegador baixa direto do S3</text>
<text x="880.0" y="391.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#444444" font-family="DejaVu Sans, Arial, sans-serif">o PDF não passa pela API</text>
</svg>
