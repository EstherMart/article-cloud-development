
services:

  backend:
    build:
      context: ./backend
    container_name: artigos-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - artigos-network

  frontend:
    build:
      context: ./frontend
    container_name: artigos-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - artigos-network

  postgres:
    image: postgres:16
    container_name: artigos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d artigos"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - artigos-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: artigos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - artigos-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: artigos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artigos-network

  worker:
    build:
      context: ./worker
    container_name: artigos-worker
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - artigos-network

volumes:
  postgres_data:
  minio_data:

networks:
  artigos-network:
    driver: bridge
