<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar artigo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="container mt-5">

        <h1 class="mb-4">
            Editar artigo
        </h1>

        <form id="form-editar">

            <!-- Título -->
            <div class="mb-3">

                <label
                    for="titulo"
                    class="form-label"
                >
                    Título
                </label>

                <input
                    type="text"
                    id="titulo"
                    class="form-control"
                    required
                >

            </div>


            <!-- Resumo -->
            <div class="mb-3">

                <label
                    for="resumo"
                    class="form-label"
                >
                    Resumo
                </label>

                <textarea
                    id="resumo"
                    class="form-control"
                    rows="4"
                    required
                ></textarea>

            </div>


            <!-- Conteúdo -->
            <div class="mb-3">

                <label
                    for="conteudo"
                    class="form-label"
                >
                    Conteúdo
                </label>

                <textarea
                    id="conteudo"
                    class="form-control"
                    rows="10"
                    required
                ></textarea>

            </div>


            <!-- Autor -->
            <div class="mb-3">

                <label
                    for="autor"
                    class="form-label"
                >
                    Autor
                </label>

                <input
                    type="text"
                    id="autor"
                    class="form-control"
                    required
                >

            </div>


            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Salvar alterações
                </button>

                <a
                    href="meus_artigos.html"
                    class="btn btn-secondary"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </main>

    <script src="js/editar_artigo.js"></script>

</body>

</html>
