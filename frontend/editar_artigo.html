<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar artigo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="navbar"></header>
    <main class="container mt-5">
        <h1 class="mb-4">Editar artigo</h1>
        <div id="alerta"></div>
        <form id="form-editar">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" id="titulo" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="autor" class="form-label">Autores</label>
                <input type="text" id="autor" class="form-control" placeholder="Digite o nome e tecle Enter">
                <div id="lista-autores" class="mt-2"></div>
            </div>
            <div class="mb-3">
                <label for="area" class="form-label">Área</label>
                <input type="text" id="area" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="tag" class="form-label">Palavras-chave</label>
                <input type="text" id="tag" class="form-control" placeholder="Digite a palavra e tecle Enter">
                <div id="lista-tags" class="mt-2"></div>
            </div>
            <div class="mb-3">
                <label for="resumo" class="form-label">Resumo</label>
                <textarea id="resumo" class="form-control" rows="5"></textarea>
            </div>
            <p class="text-muted">O PDF não pode ser trocado. Para enviar outro arquivo, exclua o artigo e crie de novo.</p>
            <div class="d-flex gap-2">
                <button type="submit" id="botao-enviar" class="btn btn-primary">Salvar</button>
                <a href="meus_artigos.html" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </main>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/editar_artigo.js"></script>
</body>
</html>
