<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artigos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="container mt-5">

        <h1 class=" titulo-artigos mb-4">
            Artigos
        </h1>

        <form
            action="artigos.html"
            method="get"
            class="d-flex gap-2 mb-4"
        >

            <input
                type="search"
                name="busca"
                id="campo-busca"
                class="form-control"
                placeholder="Pesquisar artigos..."
            >

            <button
                type="submit"
                class="btn btn-primary"
            >
                Pesquisar
            </button>

        </form>


        <h2
            id="texto-pesquisa"
            class="mb-4"
        ></h2>


        <!--Os artigos aparecerão aqui-->
        <div id="lista_artigos"></div>

    </main>


    <script src="js/artigos.js"></script>

</body>

</html>
