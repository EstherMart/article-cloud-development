<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artigo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="navbar"></header>
    <main class="container mt-5">
        <div id="alerta"></div>
        <article id="artigo" hidden>
            <div class="d-flex justify-content-between align-items-start gap-2">
                <h1 id="titulo"></h1>
                <span id="status"></span>
            </div>
            <p id="autores" class="text-muted mb-1"></p>
            <p id="area" class="text-muted"></p>
            <div id="tags" class="mb-4"></div>
            <h2>Resumo</h2>
            <p id="resumo" class="mb-4"></p>
            <h2>Resumo traduzido (inglês)</h2>
            <p id="traducao" class="mb-4"></p>
            <div class="d-flex gap-2">
                <button type="button" id="botao-download" class="btn btn-primary">Baixar PDF</button>
                <a href="artigos.html" class="btn btn-secondary">Voltar</a>
            </div>
        </article>
    </main>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/artigo.js"></script>
</body>
</html>
