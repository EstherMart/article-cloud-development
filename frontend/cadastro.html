<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="container">

        <section class="cadastro">

            <h1 class="titulo-cadastro text-center mb-4">
                Criar conta
            </h1>

            <form>
                <div class="mb-3">

                    <label for="nome" class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        class="form-control"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label for="email" class="form-label">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label for="senha" class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        class="form-control"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label for="confirmarSenha" class="form-label">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        class="form-control"
                        placeholder="Digite sua senha novamente"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label for="instituicao" class="form-label">
                        Instituição
                    </label>

                    <input
                        type="text"
                        id="instituicao"
                        class="form-control"
                        placeholder="Digite sua instituição"
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Criar conta
                </button>

            </form>


            <p class="text-center mt-3">

                Já possui uma conta?

                <a href="login.html">
                    Fazer login
                </a>

            </p>


        </section>

    </main>

</body>

</html>
