<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositório de Artigos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="navbar"></header>
    <main>
        <section class="home container text-center">
            <h1 class="aplicacao">Repositório de Artigos</h1>
            <p class="descricao">Encontre e explore artigos acadêmicos de forma rápida e fácil.</p>
            <form action="artigos.html" method="get" class="search-box d-flex gap-2">
                <input type="search" name="busca" class="form-control" placeholder="Pesquise por artigos..." aria-label="Pesquisar artigos">
                <button type="submit" class="btn btn-primary">Pesquisar</button>
            </form>
            <a href="meus_artigos.html" class="btn btn-secondary mt-3">Meus Artigos</a>
        </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
