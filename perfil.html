<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <main class="container">

        <section class="perfil">

            <h1>Meu Perfil</h1>

            <div class="mb-4">

                <img
                    src="https://via.placeholder.com/150"
                    alt="Foto de perfil"
                    width="150"
                    height="150"
                >

                <br><br>

                <label for="foto" class="form-label">
                    Alterar foto
                </label>

                <input
                    type="file"
                    id="foto"
                    class="form-control"
                    accept="image/*"
                >

            </div>

            <div class="mb-3">

                <label for="nome" class="form-label">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    class="form-control"
                    value="Livian"
                >

            </div>

            <div class="mb-3">

                <label for="email" class="form-label">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    value="livian@email.com"
                >

            </div>

            <div class="mb-3">

                <label for="instituicao" class="form-label">
                    Instituição
                </label>

                <input
                    type="text"
                    id="instituicao"
                    class="form-control"
                    placeholder="Digite sua instituição"
                >

            </div>

            <div class="mb-3">

                <label for="descricao" class="form-label">
                    Sobre você
                </label>

                <textarea
                    id="descricao"
                    class="form-control"
                    rows="4"
                    placeholder="Fale um pouco sobre você"
                ></textarea>

            </div>

            <button type="button" class="btn btn-primary">
                Salvar alterações
            </button>

        </section>

    </main>

</body>

</html>
